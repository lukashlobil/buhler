<nav class="nav">
  <div class="nav-logo">
    <img src="buhler_logo.svg" alt="Bühler" class="logo" />
  </div>
  <div class="nav-machines">
    @for (machine of machineService.machines(); track machine.id) {
      <div class="nav-machine">
        <span class="machine-name">{{ machine.name }}</span>
        <buh-state-indicator [state]="machine.state" />
      </div>
    }
  </div>
  <div class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Overview</a>
  </div>
</nav>
