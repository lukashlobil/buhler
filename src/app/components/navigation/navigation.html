<nav class="nav">
  <div class="nav-logo">
    <img src="buhler_logo.svg" alt="Bühler" class="logo" />
  </div>
  <div class="nav-machines">
    @for (machine of machineService.machines(); track machine.id) {
      <div class="nav-machine" [class]="machine.state">
        <span class="machine-name">{{ machine.name }}</span>
        <buh-state-indicator [state]="machine.state" />
      </div>
    }
  </div>
  <div class="nav-user">
    <button class="user-btn" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()">
      <span class="material-symbols-outlined">person</span>
      <span class="user-name">Operator</span>
      <span class="material-symbols-outlined chevron">{{ menuOpen() ? 'expand_less' : 'expand_more' }}</span>
    </button>
    @if (menuOpen()) {
      <ul class="user-menu" (click)="closeMenu()">
        <li>
          <a href="#">
            <span class="material-symbols-outlined">settings</span>
            Settings
          </a>
        </li>
        <li>
          <a href="#">
            <span class="material-symbols-outlined">logout</span>
            Logout
          </a>
        </li>
      </ul>
    }
  </div>
</nav>
